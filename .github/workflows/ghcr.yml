name: Publish to GHCR

# Public image consumed by bud.qalisa.fr (podman auto-update follows :main).
# Build args mirror Qalisa/IaC nix/modules/apps.nix.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: lean
          push: true
          build-args: |
            K8S_APP__VERSION=1.0.0
            CANONICAL_URL=https://legal.qalisa.fr
          tags: |
            ghcr.io/qalisa/legalstamp:main
            ghcr.io/qalisa/legalstamp:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
